spring:
  application:
    name: smart-price-monitor

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_price_telegram?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Schema versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só confere.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: none
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    # Banco de produção já existente: marca a V1 como aplicada e roda só as migrações novas
    baseline-on-migrate: true
    baseline-version: 1

# Health check numa porta separada, que não é publicada pelo docker-compose
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
  servlet:
    context-path: /api

mercadolivre:
  api:
    base-url: https://api.mercadolibre.com
    client-id: ${ML_CLIENT_ID:}
    client-secret: ${ML_CLIENT_SECRET:}
    auth-url: https://api.mercadolibre.com/oauth/token
    access-token: ${MERCADO_LIVRE_ACCESS_TOKEN:}
  provedor:
    enabled: ${ML_PROVEDOR_ENABLED:true}
  monitor:
    legado:
      enabled: false

monitoramento:
  nichos:
    cron: "0 0/5 * * * ?" # A cada 5 minutos
  modo-noturno:
    enabled: ${MODO_NOTURNO_ENABLED:true}
    inicio: ${MODO_NOTURNO_INICIO:23:00} # Início do horário noturno de descanso
    fim: ${MODO_NOTURNO_FIM:07:30} # Fim do horário noturno
    fuso-horario: ${MODO_NOTURNO_FUSO:America/Sao_Paulo}
    pausar-envios: ${MODO_NOTURNO_PAUSAR:true}
  curadoria:
    horas-anti-duplicacao: ${CURADORIA_HORAS_ANTI_DUPLICACAO:24}
    min-ciclos-anti-duplicacao: 2
    termos-por-ciclo: 5
    max-ofertas-por-nicho: 3
    minimo-desconto-percentual: 5
    # Score mínimo nos primeiros 30 dias de histórico; depois disso passa a valer o "maduro"
    score-minimo: ${CURADORIA_SCORE_MINIMO:20}
    score-minimo-maduro: ${CURADORIA_SCORE_MINIMO_MADURO:50}
    dias-para-score-maduro: 30
    delay-ms: 400
  # Pesos do score de oferta (0 a 100)
  score:
    peso-desconto: 35
    desconto-teto: 50
    peso-menor-preco: 25
    peso-cupom: 15
    peso-vendedor: 10
    peso-frete: 5
  vendedor:
    # Vendedor abaixo deste nível de reputação no ML é descartado; loja oficial passa sempre
    nivel-minimo: ${VENDEDOR_NIVEL_MINIMO:4_light_green}
    nivel-alto: 5_green

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:@smartpriceofertas}
    chat-id-tech: ${TELEGRAM_CHAT_ID_TECH:}

# Aviso no canal técnico (TELEGRAM_CHAT_ID_TECH) quando um canal de envio falha N vezes seguidas
alertas:
  falhas-seguidas: ${ALERTAS_FALHAS_SEGUIDAS:3}

whatsapp:
  enabled: ${WHATSAPP_ENABLED:true}
  api-url: ${WHATSAPP_API_URL:http://evolution-api:8080}
  api-key: ${WHATSAPP_API_KEY} # sem valor padrão: o app não sobe sem a chave no .env
  instance-name: ${WHATSAPP_INSTANCE_NAME:smartprice}
  group-id: ${WHATSAPP_GROUP_ID:}

afiliado:
  mercadolivre:
    matt-tool: ${ML_MATT_TOOL:}
    matt-word: ${ML_MATT_WORD:}
    force-in-app: ${ML_FORCE_IN_APP:true}
    tag: ${ML_AFILIADO_TAG:}

# Chave exigida no header X-API-Key de todas as rotas (gere com: openssl rand -hex 32)
seguranca:
  api-key: ${API_KEY:}

cupons:
  crawler:
    enabled: ${CUPONS_CRAWLER_ENABLED:true}
    cron: "0 0/5 * * * ?" # A cada 5 minutos
    fontes:
      - "https://t.me/s/MercadoCuponsBR"
      - "https://t.me/s/promosdorafa"
      - "https://t.me/s/PromoCupons_Brasil"
  monitor:
    enabled: ${CUPONS_MONITOR_ENABLED:true}
    cron: "0 0/5 * * * ?" # A cada 5 minutos
    max-horas-ttl: 12
  validador:
    enabled: ${CUPONS_VALIDADOR_ENABLED:true}
    timeout-ms: 4000
  anuncio-avulso:
    enabled: ${CUPONS_ANUNCIO_AVULSO_ENABLED:true}
    cron: "0 0/15 * * * ?"
    intervalo-minutos: ${CUPONS_AVULSO_INTERVALO_MINUTOS:45} # Intervalo mínimo entre notificações avulsas
    min-desconto-reais: ${CUPONS_AVULSO_MIN_REAIS:30.0} # Desconto mínimo fixo para publicação avulsa
    min-desconto-percentual: ${CUPONS_AVULSO_MIN_PERCENTUAL:10.0} # Desconto mínimo percentual para publicação avulsa
