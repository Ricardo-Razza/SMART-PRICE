spring:
  application:
    name: smart-price-monitor

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_price_telegram?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: none
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
  servlet:
    context-path: /api

mercadolivre:
  api:
    base-url: https://api.mercadolibre.com
    client-id: ${ML_CLIENT_ID:}
    client-secret: ${ML_CLIENT_SECRET:}
    auth-url: https://api.mercadolibre.com/oauth/token
    access-token: ${MERCADO_LIVRE_ACCESS_TOKEN:}
  provedor:
    enabled: ${ML_PROVEDOR_ENABLED:true}
  monitor:
    legado:
      enabled: false

monitoramento:
  nichos:
    cron: "0 0/15 * * * ?" # A cada 15 minutos
  modo-noturno:
    enabled: ${MODO_NOTURNO_ENABLED:true}
    inicio: ${MODO_NOTURNO_INICIO:23:00} # Início do horário noturno de descanso
    fim: ${MODO_NOTURNO_FIM:07:30} # Fim do horário noturno
    fuso-horario: ${MODO_NOTURNO_FUSO:America/Sao_Paulo}
    pausar-envios: ${MODO_NOTURNO_PAUSAR:true}
  curadoria:
    horas-anti-duplicacao: 24
    min-ciclos-anti-duplicacao: 3
    termos-por-ciclo: 5
    max-ofertas-por-nicho: 2
    minimo-desconto-percentual: 5
    score-minimo: ${CURADORIA_SCORE_MINIMO:20}
    delay-ms: 600

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:@smartpriceofertas}

cupons:
  crawler:
    enabled: ${CUPONS_CRAWLER_ENABLED:true}
    cron: "0 0/5 * * * ?" # A cada 5 minutos
    fontes:
      - "https://t.me/s/MercadoCuponsBR"
      - "https://t.me/s/promosdorafa"
      - "https://t.me/s/PromoCupons_Brasil"
  monitor:
    enabled: ${CUPONS_MONITOR_ENABLED:true}
    cron: "0 0/5 * * * ?" # A cada 5 minutos
    max-horas-ttl: 12
  validador:
    enabled: ${CUPONS_VALIDADOR_ENABLED:true}
    timeout-ms: 4000
  anuncio-avulso:
    enabled: ${CUPONS_ANUNCIO_AVULSO_ENABLED:true}
    cron: "0 0/15 * * * ?"
    intervalo-minutos: ${CUPONS_AVULSO_INTERVALO_MINUTOS:45} # Intervalo mínimo entre notificações avulsas
    min-desconto-reais: ${CUPONS_AVULSO_MIN_REAIS:30.0} # Desconto mínimo fixo para publicação avulsa
    min-desconto-percentual: ${CUPONS_AVULSO_MIN_PERCENTUAL:10.0} # Desconto mínimo percentual para publicação avulsa
