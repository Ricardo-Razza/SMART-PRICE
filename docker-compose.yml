services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartprice-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    # Permite ao container se comunicar com o MySQL nativo rodando na VPS pelo host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_NAME:-smart_price_telegram}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      MERCADO_LIVRE_ACCESS_TOKEN: ${MERCADO_LIVRE_ACCESS_TOKEN:-}
      ML_PROVEDOR_ENABLED: ${ML_PROVEDOR_ENABLED:-true}
      MODO_NOTURNO_ENABLED: ${MODO_NOTURNO_ENABLED:-true}
      MODO_NOTURNO_INICIO: ${MODO_NOTURNO_INICIO:-23:00}
      MODO_NOTURNO_FIM: ${MODO_NOTURNO_FIM:-07:30}
      MODO_NOTURNO_FUSO: ${MODO_NOTURNO_FUSO:-America/Sao_Paulo}
      MODO_NOTURNO_PAUSAR: ${MODO_NOTURNO_PAUSAR:-true}
      IA_GEMINI_ENABLED: ${IA_GEMINI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      IA_GEMINI_MODEL: ${IA_GEMINI_MODEL:-gemini-3.6-flash}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-@smartpriceofertas}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-http://evolution-api:8080}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-smartprice_whatsapp_secret_key}
      WHATSAPP_INSTANCE_NAME: ${WHATSAPP_INSTANCE_NAME:-smartprice}
      WHATSAPP_GROUP_ID: ${WHATSAPP_GROUP_ID:-}
      ML_MATT_TOOL: ${ML_MATT_TOOL:-}
      ML_MATT_WORD: ${ML_MATT_WORD:-}
      ML_FORCE_IN_APP: ${ML_FORCE_IN_APP:-true}
      ML_AFILIADO_TAG: ${ML_AFILIADO_TAG:-}
      CUPONS_CRAWLER_ENABLED: ${CUPONS_CRAWLER_ENABLED:-true}
      CUPONS_MONITOR_ENABLED: ${CUPONS_MONITOR_ENABLED:-true}
      CUPONS_VALIDADOR_ENABLED: ${CUPONS_VALIDADOR_ENABLED:-true}
      CUPONS_ANUNCIO_AVULSO_ENABLED: ${CUPONS_ANUNCIO_AVULSO_ENABLED:-true}
      CUPONS_AVULSO_INTERVALO_MINUTOS: ${CUPONS_AVULSO_INTERVALO_MINUTOS:-45}
      CUPONS_AVULSO_MIN_REAIS: ${CUPONS_AVULSO_MIN_REAIS:-30.0}
      CUPONS_AVULSO_MIN_PERCENTUAL: ${CUPONS_AVULSO_MIN_PERCENTUAL:-10.0}
      TZ: America/Sao_Paulo
    volumes:
      - app_logs:/app/logs
    depends_on:
      - evolution-api

  # Evolution API v2 para automação e envio em grupos do WhatsApp
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8081}:8080"
    environment:
      SERVER_URL: ${WHATSAPP_SERVER_URL:-http://localhost:8081}
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:-smartprice_whatsapp_secret_key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution_secret@evolution-db:5432/evolution?schema=public"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_MESSAGES: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://evolution-redis:6379/6"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CONFIG_SESSION_PHONE_CLIENT: "SmartPrice Monitor"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      TZ: America/Sao_Paulo
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_started

  # Cache Redis leve para sessões e fila do WhatsApp
  evolution-redis:
    image: redis:alpine
    container_name: evolution-redis
    restart: unless-stopped

  # Banco Postgres isolado e leve para a Evolution API persistir sessões do WhatsApp
  evolution-db:
    image: postgres:16-alpine
    container_name: evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_secret
      POSTGRES_DB: evolution
      TZ: America/Sao_Paulo
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Banco isolado no Docker (OPCIONAL: só inicia se usar 'docker compose --profile with-mysql up -d')
  mysql:
    profiles:
      - with-mysql
    image: mysql:8.0
    container_name: smartprice-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${DB_NAME:-smart_price_telegram}
      MYSQL_USER: ${DB_USERNAME:-smartprice}
      MYSQL_PASSWORD: ${DB_PASSWORD:-smartprice_secret_change_me}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-smartprice}", "-p${DB_PASSWORD:-smartprice_secret_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local
  evolution_instances:
    driver: local
  evolution_db_data:
    driver: local
