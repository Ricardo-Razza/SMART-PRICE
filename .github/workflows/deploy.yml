name: CI/CD - Test & Publish Image

# Testa, monta a imagem Docker e publica no GitHub Container Registry (ghcr.io).
# A VPS não recebe acesso do GitHub: para atualizar, baixe a imagem nova e reinicie o container
# (docker compose pull app && docker compose up -d app, ou pelo painel Docker do aaPanel).

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite disparar manualmente pela aba Actions do GitHub

env:
  IMAGEM: ghcr.io/ricardo-razza/smart-price

jobs:
  test:
    name: 🧪 Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x ./mvnw

      - name: Executar Testes
        run: ./mvnw clean test -B

  publish:
    name: 📦 Publicar imagem no GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Montar e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest para o compose da VPS; o SHA permite voltar para uma versão exata
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Como atualizar a VPS
        run: |
          echo "Imagem publicada: ${{ env.IMAGEM }}:latest (versão ${{ github.sha }})"
          echo "Na VPS: cd /www/SmartPrice/smart-price && docker compose pull app && docker compose up -d app"
